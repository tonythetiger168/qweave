name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: pip install -e .[dev]
      - name: P0 engine validation (14 checks, incl. Stim gold standard)
        run: python phase1_basic/validate_p0.py
      - name: "Phase B validation (22 checks: IR/QASM, trajectory, DEM+PyMatching)"
        run: python phase2_noise/validate_p0b.py
      - name: "Phase C validation (27 checks: backends/MPS/IPEA/VQE/torch)"
        run: python phase3_scale/validate_p0c.py
      - name: QL1 validation (10 checks, TN compression)
        run: python phase4_llm/validate_ql1.py
      - name: QL1.5 heal pipeline smoke, raw MPO (CPU, no downloads)
        run: python phase4_llm/heal_finetune.py --smoke --format mpo --steps 20 --out /tmp/ql15-smoke
      - name: Install transformers (QL5 suite builds a tiny random Qwen3)
        run: pip install "transformers>=4.56"
      - name: "QL5 validation (12 groups: gauge fixing, embedding SVD, chunked KD, Fisher, gate)"
        run: python phase4_llm/validate_ql5.py
      - name: "QL6 validation (9 groups: byte roofline, rank alignment, fusion, lossless speculative decoding)"
        run: python phase4_llm/validate_ql6.py
      - name: CLI smoke test
        run: qweave --phase 1
